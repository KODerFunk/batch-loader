name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Dev-stack dependencies require Node >= 22 (eslint 10, unicorn 74, np 12);
        # the library's own runtime requirements — see "engines" in package.json
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run ts-check
    - run: npm run lint:ci
    - run: npm run test:ci
    - run: ./scripts/ci-smoke-test.sh

  # The library itself targets Node >= 18 (see "engines" in package.json); the dev toolchain
  # needs Node >= 22, so only the test suite runs on the older runtimes — no lint, no tsc
  test-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run test:ci
    # Both module formats of the real artifact on the oldest supported runtimes
    # (the build itself works there too — dev deps are installed via npm ci)
    - run: ./scripts/ci-smoke-test.sh
